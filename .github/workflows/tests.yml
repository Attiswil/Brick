name: Tests

on:
  push:
  pull_request:

jobs:
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest -q

  phone-engine:
    # The iPhone's brick engine (rules, emergency unbricks, reset, commands
    # from Home Assistant) has no Apple-only dependencies, so it tests on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios/BrickCore
