brick:
  fields:
    device_id: &phone
      selector:
        device:
          integration: brick_hub
          multiple: true
    mode:
      example: "Deep work"
      selector:
        text:
    duration:
      example: "01:30:00"
      selector:
        duration:
    source:
      example: "Bedtime"
      selector:
        text:
unbrick:
  fields:
    device_id: *phone
    source:
      selector:
        text:
toggle:
  fields:
    device_id: *phone
    mode:
      selector:
        text:
    duration:
      selector:
        duration:
    source:
      selector:
        text:
emergency_unbrick:
  fields:
    device_id: *phone
request_emergency_reset:
  fields:
    device_id: *phone
cancel_emergency_reset:
  fields:
    device_id: *phone
add_tag:
  fields:
    device_id: *phone
    tag_id:
      required: true
      example: "04-A1-B2-C3-D4-E5-F6"
      selector:
        text:
    name:
      example: "Front door reader"
      selector:
        text:
remove_tag:
  fields:
    device_id: *phone
    tag_id:
      required: true
      selector:
        text:
